<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CentiSense</title>
        <style>
            :root {
                --bg: #0f0f12;
                --surface: #18181f;
                --surface2: #1f1f28;
                --text: #c8c8d4;
                --text-secondary: #707088;
                --text-muted: #4a4a58;
                --accent: #5b8db8;
                --accent-dim: #3d5f7a;
                --correct: #5a9e6f;
                --incorrect: #b85c5c;
                --border: #282835;
                --radius: 8px;
                --transition: 0.15s ease;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    "Inter",
                    "Segoe UI",
                    "PingFang SC",
                    "Microsoft YaHei",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 24px;
            }

            .container {
                max-width: 960px;
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 20px 24px;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 24px;
                padding-bottom: 16px;
                border-bottom: 1px solid var(--border);
            }
            header h1 {
                font-size: 1.5rem;
                font-weight: 600;
                letter-spacing: -0.3px;
                color: var(--text);
            }
            header p {
                font-size: 0.8rem;
                color: var(--text-secondary);
            }

            .main-layout {
                display: flex;
                gap: 28px;
                align-items: flex-start;
                flex-wrap: wrap;
                justify-content: center;
            }

            /* ---- Loading overlay (replaces main-layout during analysis) ---- */
            #loading-overlay {
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 80px 20px;
                color: var(--text-secondary);
                font-size: 0.9rem;
            }
            #loading-overlay.visible {
                display: flex;
            }
            #loading-overlay .spinner {
                width: 28px;
                height: 28px;
                border-width: 3px;
            }
            #main-content.hidden {
                display: none;
            }

            /* ---- Board ---- */
            .board-section {
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .board-container {
                line-height: 0;
                border-radius: 3px;
                overflow: hidden;
                box-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
                border: 1px solid var(--border);
            }
            .board-container svg {
                display: block;
                width: 400px;
                height: 400px;
            }
            .board-meta {
                display: flex;
                gap: 12px;
                align-items: center;
                font-size: 0.75rem;
                color: var(--text-secondary);
            }
            .side-badge {
                font-weight: 500;
                font-size: 0.78rem;
                margin-top: 12px;
                padding: 3px 12px;
                border-radius: 4px;
                background: var(--surface2);
                border: 1px solid var(--border);
                cursor: pointer;
                transition: background var(--transition);
            }
            .side-badge:hover {
                background: #2a2a35;
            }
            .fen-display {
                font-family: "SF Mono", "Fira Code", "Consolas", monospace;
                font-size: 0.68rem;
                color: var(--text-muted);
                word-break: break-all;
                text-align: center;
                max-width: 400px;
                line-height: 1.5;
            }

            /* ---- Controls ---- */
            .controls-section {
                flex: 1;
                min-width: 280px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .panel {
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 18px;
            }
            .panel h3 {
                font-size: 0.78rem;
                font-weight: 500;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 1.2px;
                margin-bottom: 14px;
            }

            /* ---- Evaluation Buttons ---- */
            .eval-buttons {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .eval-btn {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 14px;
                border: 1px solid var(--border);
                border-left: 4px solid var(--border);
                border-radius: 0 var(--radius) var(--radius) 0;
                background: var(--surface);
                cursor: pointer;
                font-size: 0.9rem;
                font-weight: 500;
                color: var(--text);
                transition: all var(--transition);
            }
            .eval-btn:hover {
                background: #25252f;
                border-left-width: 6px;
                padding-left: 12px;
            }
            .eval-btn:active {
                transform: scale(0.99);
            }
            .eval-btn:disabled {
                opacity: 0.35;
                cursor: not-allowed;
                pointer-events: none;
            }
            .eval-btn .range {
                font-size: 0.7rem;
                color: var(--text-muted);
                font-weight: 400;
                font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            }

            /* White-advantage buttons: green-tinted left border */
            .btn-ww {
                border-left-color: #4a9060;
            }
            .btn-wb {
                border-left-color: #5a9668;
            }
            .btn-ws {
                border-left-color: #6a9c70;
            }
            /* Equal */
            .btn-eq {
                border-left-color: #585868;
            }
            /* Black-advantage buttons: red-tinted left border */
            .btn-bs {
                border-left-color: #9c6a6a;
            }
            .btn-bb {
                border-left-color: #965a5a;
            }
            .btn-bw {
                border-left-color: #904a4a;
            }

            /* ---- Result Panel ---- */
            #result-panel {
                display: none;
            }
            #result-panel.visible {
                display: block;
                animation: fadeIn 0.25s ease;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .result-summary {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 16px;
                padding: 12px;
                border-radius: 6px;
                font-weight: 600;
                font-size: 0.95rem;
            }
            .result-summary.correct {
                background: rgba(90, 158, 111, 0.08);
                border: 1px solid rgba(90, 158, 111, 0.25);
                color: var(--correct);
            }
            .result-summary.incorrect {
                background: rgba(184, 92, 92, 0.08);
                border: 1px solid rgba(184, 92, 92, 0.25);
                color: var(--incorrect);
            }

            .result-details {
                display: flex;
                flex-direction: column;
                gap: 8px;
                font-size: 0.88rem;
            }
            .detail-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 6px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            }
            .detail-row:last-child {
                border-bottom: none;
            }
            .detail-label {
                color: var(--text-secondary);
                font-size: 0.8rem;
            }
            .detail-value {
                font-weight: 500;
                text-align: right;
            }
            .detail-value.green {
                color: var(--correct);
            }
            .detail-value.red {
                color: var(--incorrect);
            }

            .pv-line {
                font-family: "SF Mono", "Fira Code", "Consolas", monospace;
                font-size: 0.76rem;
                color: #9090a0;
                background: rgba(0, 0, 0, 0.2);
                padding: 8px 12px;
                border-radius: 5px;
                word-break: break-all;
            }

            .next-btn-wrap {
                margin-top: 14px;
                text-align: center;
            }
            .next-btn {
                padding: 10px 32px;
                font-size: 0.95rem;
                font-weight: 500;
                background: var(--accent-dim);
                color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                cursor: pointer;
                transition: all var(--transition);
            }
            .next-btn:hover {
                background: var(--accent);
                box-shadow: 0 2px 16px rgba(91, 141, 184, 0.2);
            }
            .next-btn:active {
                transform: scale(0.97);
            }
            .next-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            /* ---- Stats ---- */
            .stats-bar {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 16px;
                font-size: 0.78rem;
                color: var(--text-secondary);
            }
            .stats-bar .correct-count {
                color: var(--correct);
                font-weight: 600;
            }
            .stats-bar .total-count {
                color: var(--text);
                font-weight: 600;
            }
            .stats-bar .accuracy {
                color: var(--accent);
                font-weight: 600;
            }

            /* ---- Loading ---- */
            .loading-indicator {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: var(--text-secondary);
                font-size: 0.82rem;
                padding: 20px;
            }
            .spinner {
                width: 18px;
                height: 18px;
                border: 2.5px solid rgba(255, 255, 255, 0.12);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .shortcut-hint {
                font-size: 0.65rem;
                color: var(--text-muted);
                margin-top: 10px;
                text-align: center;
            }
            .shortcut-hint kbd {
                display: inline-block;
                padding: 1px 5px;
                border: 1px solid var(--border);
                border-radius: 3px;
                font-family: inherit;
                font-size: 0.65rem;
                background: var(--surface);
            }

            @media (max-width: 700px) {
                .main-layout {
                    flex-direction: column;
                    align-items: center;
                }
                .board-container svg {
                    width: 320px;
                    height: 320px;
                }
                .container {
                    padding: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>CentiSense</h1>
                <p>Stockfish 19 &middot; depth 20</p>
            </header>

            <div id="loading-overlay" class="visible">
                <div class="spinner"></div>
                <span>Stockfish analyzing...</span>
            </div>
            <div class="main-layout hidden" id="main-content">
                <!-- Board -->
                <div class="board-section">
                    <div class="board-container" id="board-container"></div>
                    <div class="board-meta">
                        <span
                            class="side-badge"
                            id="fen-badge"
                            title="Click to copy FEN"
                        ></span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls-section">
                    <div class="panel" id="guess-panel">
                        <h3 id="guess-heading"></h3>
                        <div class="eval-buttons">
                            <button
                                class="eval-btn btn-ww"
                                data-category="white_winning"
                            >
                                <span class="label">White winning</span>
                                <span class="range">&ge; +3.00</span>
                            </button>
                            <button
                                class="eval-btn btn-wb"
                                data-category="white_big"
                            >
                                <span class="label">White clear advantage</span>
                                <span class="range">+1.50 &ndash; +2.99</span>
                            </button>
                            <button
                                class="eval-btn btn-ws"
                                data-category="white_slight"
                            >
                                <span class="label">White slight edge</span>
                                <span class="range">+0.50 &ndash; +1.49</span>
                            </button>
                            <button
                                class="eval-btn btn-eq"
                                data-category="equal"
                            >
                                <span class="label">Equal</span>
                                <span class="range"
                                    >&minus;0.49 &ndash; +0.49</span
                                >
                            </button>
                            <button
                                class="eval-btn btn-bs"
                                data-category="black_slight"
                            >
                                <span class="label">Black slight edge</span>
                                <span class="range"
                                    >&minus;1.49 &ndash; &minus;0.50</span
                                >
                            </button>
                            <button
                                class="eval-btn btn-bb"
                                data-category="black_big"
                            >
                                <span class="label">Black clear advantage</span>
                                <span class="range"
                                    >&minus;2.99 &ndash; &minus;1.50</span
                                >
                            </button>
                            <button
                                class="eval-btn btn-bw"
                                data-category="black_winning"
                            >
                                <span class="label">Black winning</span>
                                <span class="range">&le; &minus;3.00</span>
                            </button>
                        </div>
                        <div class="shortcut-hint">
                            Keys <kbd>1</kbd>&ndash;<kbd>7</kbd> &middot;
                            <kbd>Space</kbd> next
                        </div>
                    </div>

                    <div class="panel" id="result-panel">
                        <h3>Analysis result</h3>
                        <div id="result-content"></div>
                        <div class="next-btn-wrap">
                            <button
                                class="next-btn"
                                id="next-btn"
                                onclick="nextPosition()"
                            >
                                Next position
                            </button>
                        </div>
                    </div>

                    <div class="stats-bar">
                        <span
                            >Correct:
                            <span class="correct-count" id="correct-count"
                                >0</span
                            ></span
                        >
                        <span
                            >Total:
                            <span class="total-count" id="total-count"
                                >0</span
                            ></span
                        >
                        <span
                            >Rate:
                            <span class="accuracy" id="accuracy"
                                >&mdash;</span
                            ></span
                        >
                    </div>
                </div>
            </div>
        </div>

        <script>
            let currentSessionId = null;
            let isLoading = false;
            let correctCount = 0;
            let totalCount = 0;

            async function loadPosition() {
                if (isLoading) return;
                isLoading = true;

                // Hide main content, show loading overlay
                document.getElementById("main-content").classList.add("hidden");
                document
                    .getElementById("result-panel")
                    .classList.remove("visible");
                document.getElementById("guess-panel").style.display = "block";
                document
                    .getElementById("loading-overlay")
                    .classList.add("visible");
                document.getElementById("fen-badge").textContent = "";
                document.getElementById("guess-heading").textContent = "";

                document
                    .querySelectorAll(".eval-btn")
                    .forEach((b) => (b.disabled = false));

                try {
                    const res = await fetch("/api/position");
                    if (!res.ok) {
                        let detail = `HTTP ${res.status}`;
                        try {
                            const err = await res.json();
                            if (err.detail) detail = err.detail;
                        } catch {}
                        throw new Error(detail);
                    }
                    const data = await res.json();

                    currentSessionId = data.session_id;

                    // Hide loading overlay, show main content
                    document
                        .getElementById("loading-overlay")
                        .classList.remove("visible");
                    document
                        .getElementById("main-content")
                        .classList.remove("hidden");

                    document.getElementById("board-container").innerHTML =
                        data.svg;

                    // FEN in clickable badge
                    const fenBadge = document.getElementById("fen-badge");
                    fenBadge.textContent = data.fen;

                    // Side to move as panel heading
                    document.getElementById("guess-heading").textContent =
                        data.side_to_move === "white"
                            ? "White to move"
                            : "Black to move";
                } catch (err) {
                    document
                        .getElementById("loading-overlay")
                        .classList.remove("visible");
                    document
                        .getElementById("main-content")
                        .classList.remove("hidden");
                    document.getElementById("board-container").innerHTML =
                        `<div style="color:var(--incorrect);text-align:center;padding:40px;">
                        Failed to load<br><small>${err.message}</small><br>
                        <button onclick="loadPosition()" style="margin-top:12px;padding:6px 16px;border-radius:4px;cursor:pointer;">Retry</button>
                    </div>`;
                } finally {
                    isLoading = false;
                }
            }

            async function submitGuess(category) {
                if (!currentSessionId || isLoading) return;
                isLoading = true;
                document
                    .querySelectorAll(".eval-btn")
                    .forEach((b) => (b.disabled = true));

                try {
                    const res = await fetch("/api/guess", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            session_id: currentSessionId,
                            category,
                        }),
                    });
                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || `HTTP ${res.status}`);
                    }
                    const result = await res.json();
                    displayResult(result);
                    updateStats(result.correct);
                    currentSessionId = null;
                } catch (err) {
                    alert("Submit failed: " + err.message);
                    document
                        .querySelectorAll(".eval-btn")
                        .forEach((b) => (b.disabled = false));
                } finally {
                    isLoading = false;
                }
            }

            function displayResult(result) {
                const panel = document.getElementById("result-panel");
                const isCorrect = result.correct;
                const cls = isCorrect ? "correct" : "incorrect";
                const summary = isCorrect ? "Correct" : "Incorrect";

                const catNames = {
                    white_winning: "White winning",
                    white_big: "White clear advantage",
                    white_slight: "White slight edge",
                    equal: "Equal",
                    black_slight: "Black slight edge",
                    black_big: "Black clear advantage",
                    black_winning: "Black winning",
                };

                let pvHTML = "";
                if (result.pv && result.pv.length > 0) {
                    pvHTML = `<div class="detail-row"><span class="detail-label">Principal variation</span></div>
                          <div class="pv-line">${result.pv.join(" ")}</div>`;
                }

                document.getElementById("result-content").innerHTML = `
                <div class="result-summary ${cls}">
                    <span>${isCorrect ? "&#10003;" : "&#10007;"}</span>
                    <span>${summary}</span>
                </div>
                <div class="result-details">
                    <div class="detail-row">
                        <span class="detail-label">Your guess</span>
                        <span class="detail-value">${catNames[result.guess_category] || result.guess_category}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Correct answer</span>
                        <span class="detail-value ${isCorrect ? "green" : "red"}">${result.correct_label}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Stockfish evaluation</span>
                        <span class="detail-value">${result.eval_text}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Best move</span>
                        <span class="detail-value green">${result.bestmove || "N/A"}</span>
                    </div>
                    ${pvHTML}
                </div>`;

                panel.classList.add("visible");
                document.getElementById("guess-panel").style.display = "none";
            }

            function updateStats(correct) {
                totalCount++;
                if (correct) correctCount++;
                document.getElementById("correct-count").textContent =
                    correctCount;
                document.getElementById("total-count").textContent = totalCount;
                const rate =
                    totalCount > 0
                        ? ((correctCount / totalCount) * 100).toFixed(1) + "%"
                        : "\u2014";
                document.getElementById("accuracy").textContent = rate;
            }

            function nextPosition() {
                document
                    .getElementById("result-panel")
                    .classList.remove("visible");
                document.getElementById("guess-panel").style.display = "block";
                loadPosition();
            }

            document.querySelectorAll(".eval-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    if (btn.dataset.category) submitGuess(btn.dataset.category);
                });
            });

            document.addEventListener("keydown", (e) => {
                if (isLoading) return;
                const map = {
                    1: "white_winning",
                    2: "white_big",
                    3: "white_slight",
                    4: "equal",
                    5: "black_slight",
                    6: "black_big",
                    7: "black_winning",
                    n: "next",
                    " ": "next",
                };
                const action = map[e.key];
                if (!action) return;
                e.preventDefault();
                if (action === "next") {
                    if (!currentSessionId) nextPosition();
                } else if (currentSessionId) {
                    submitGuess(action);
                }
            });

            // FEN badge: click to copy
            document
                .getElementById("fen-badge")
                .addEventListener("click", () => {
                    const badge = document.getElementById("fen-badge");
                    const fen = badge.textContent;
                    if (!fen) return;
                    navigator.clipboard
                        .writeText(fen)
                        .then(() => {
                            badge.style.borderColor = "var(--correct)";
                            badge.style.color = "var(--correct)";
                            // Show floating tooltip so badge width stays stable
                            const tip = document.createElement("span");
                            tip.textContent = "Copied";
                            tip.style.cssText =
                                "position:absolute;top:-24px;left:50%;transform:translateX(-50%);" +
                                "font-size:0.7rem;color:var(--correct);background:var(--surface2);" +
                                "padding:2px 8px;border-radius:3px;border:1px solid var(--correct);" +
                                "white-space:nowrap;pointer-events:none;z-index:10;";
                            badge.style.position = "relative";
                            badge.appendChild(tip);
                            setTimeout(() => {
                                tip.remove();
                                badge.style.borderColor = "";
                                badge.style.color = "";
                                badge.style.position = "";
                            }, 1000);
                        })
                        .catch(() => {
                            const ta = document.createElement("textarea");
                            ta.value = fen;
                            ta.style.position = "fixed";
                            ta.style.opacity = "0";
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand("copy");
                            document.body.removeChild(ta);
                        });
                });

            loadPosition();
        </script>
    </body>
</html>
