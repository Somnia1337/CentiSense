<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvalGuessr — 国际象棋局面评估训练</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface2: #0f3460;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
            --accent: #e94560;
            --accent2: #533483;
            --green: #4caf84;
            --green-dark: #2d6a4f;
            --yellow: #d4a843;
            --orange: #e07b39;
            --red: #d94141;
            --border: #2a2a4a;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(233, 69, 96, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(83, 52, 131, 0.12) 0%, transparent 60%);
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #d4789e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .main-layout {
            display: flex;
            gap: 28px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .board-section {
            flex-shrink: 0;
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .board-section .board-container {
            line-height: 0;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .board-section .board-container svg {
            display: block;
            width: 400px;
            height: 400px;
        }

        .fen-display {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.72rem;
            color: var(--text-secondary);
            word-break: break-all;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 10px;
            border-radius: 6px;
            max-width: 400px;
            line-height: 1.4;
        }

        .side-indicator {
            font-weight: 600;
            font-size: 0.9rem;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }
        .side-indicator.white {
            color: #f0f0f0;
            border-color: #555;
        }
        .side-indicator.black {
            color: #aaa;
            border-color: #444;
        }

        .controls-section {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .guess-panel, .result-panel {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }

        .guess-panel h3, .result-panel h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .eval-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .eval-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .eval-btn:hover {
            transform: translateX(4px);
            filter: brightness(1.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .eval-btn:active {
            transform: scale(0.98);
        }
        .eval-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            filter: none;
            box-shadow: none;
        }

        .eval-btn .label {
            font-size: 1.05rem;
        }
        .eval-btn .range {
            font-size: 0.75rem;
            opacity: 0.7;
            font-weight: 400;
        }

        .btn-white-winning {
            background: linear-gradient(135deg, #1a6b3c, #0d4a28);
            border-color: #2ecc71;
        }
        .btn-white-big {
            background: linear-gradient(135deg, #1a7a4a, #1a5c3a);
            border-color: #27ae60;
        }
        .btn-white-slight {
            background: linear-gradient(135deg, #2a6a4a, #1e5038);
            border-color: #52be80;
        }
        .btn-equal {
            background: linear-gradient(135deg, #4a4a5a, #3a3a4a);
            border-color: #888;
        }
        .btn-black-slight {
            background: linear-gradient(135deg, #5a3a3a, #4a2a2a);
            border-color: #c0392b;
        }
        .btn-black-big {
            background: linear-gradient(135deg, #6a2a2a, #5a1a1a);
            border-color: #e74c3c;
        }
        .btn-black-winning {
            background: linear-gradient(135deg, #6b1a1a, #4a0d0d);
            border-color: #e74c3c;
        }

        .result-panel {
            display: none;
        }
        .result-panel.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-summary {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .result-summary.correct {
            background: rgba(76, 175, 132, 0.15);
            border: 1px solid var(--green);
            color: var(--green);
        }
        .result-summary.incorrect {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .result-summary .icon {
            font-size: 1.6rem;
        }

        .result-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.92rem;
        }
        .result-details .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .result-details .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .detail-value {
            font-weight: 600;
            text-align: right;
        }
        .detail-value.green {
            color: var(--green);
        }
        .detail-value.red {
            color: var(--accent);
        }

        .pv-line {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.8rem;
            color: #c0c0d0;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
        }

        .next-btn-container {
            margin-top: 16px;
            text-align: center;
        }

        .next-btn {
            padding: 12px 36px;
            font-size: 1.05rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.5px;
        }
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(233, 69, 96, 0.35);
            filter: brightness(1.1);
        }
        .next-btn:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }
        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .stats-bar span {
            font-weight: 600;
        }
        .stats-bar .correct-count {
            color: var(--green);
        }
        .stats-bar .total-count {
            color: var(--text);
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 20px;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 700px) {
            .main-layout {
                flex-direction: column;
                align-items: center;
            }
            .board-section .board-container svg {
                width: 320px;
                height: 320px;
            }
            .container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>EvalGuessr</h1>
            <p>观察局面，判断形势 — 用 Stockfish 18 验证你的棋感</p>
        </header>

        <div class="main-layout">
            <!-- Board -->
            <div class="board-section">
                <div class="board-container" id="board-container">
                    <div class="loading-indicator">
                        <div class="spinner"></div>
                        <span>加载中...</span>
                    </div>
                </div>
                <div class="fen-display" id="fen-display"></div>
                <div class="side-indicator" id="side-indicator"></div>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <!-- Guess panel -->
                <div class="guess-panel" id="guess-panel">
                    <h3>你的判断</h3>
                    <div class="eval-buttons" id="eval-buttons">
                        <button class="eval-btn btn-white-winning" data-category="white_winning">
                            <span class="label">🏆 白胜势</span>
                            <span class="range">≥ +3.00</span>
                        </button>
                        <button class="eval-btn btn-white-big" data-category="white_big">
                            <span class="label">📈 白大优</span>
                            <span class="range">+1.50 ~ +2.99</span>
                        </button>
                        <button class="eval-btn btn-white-slight" data-category="white_slight">
                            <span class="label">📊 白小优</span>
                            <span class="range">+0.50 ~ +1.49</span>
                        </button>
                        <button class="eval-btn btn-equal" data-category="equal">
                            <span class="label">⚖️ 均势</span>
                            <span class="range">-0.49 ~ +0.49</span>
                        </button>
                        <button class="eval-btn btn-black-slight" data-category="black_slight">
                            <span class="label">📊 黑小优</span>
                            <span class="range">-1.49 ~ -0.50</span>
                        </button>
                        <button class="eval-btn btn-black-big" data-category="black_big">
                            <span class="label">📉 黑大优</span>
                            <span class="range">-2.99 ~ -1.50</span>
                        </button>
                        <button class="eval-btn btn-black-winning" data-category="black_winning">
                            <span class="label">💀 黑胜势</span>
                            <span class="range">≤ -3.00</span>
                        </button>
                    </div>
                </div>

                <!-- Result panel (hidden initially) -->
                <div class="result-panel" id="result-panel">
                    <h3>分析结果</h3>
                    <div id="result-content"></div>
                    <div class="next-btn-container">
                        <button class="next-btn" id="next-btn" onclick="nextPosition()">
                            ▶ 下一题
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="stats-bar">
            正确: <span class="correct-count" id="correct-count">0</span> /
            总计: <span class="total-count" id="total-count">0</span>
            (<span id="accuracy">-</span>)
        </div>
    </div>

    <script>
        // --- State ---
        let currentSessionId = null;
        let currentSideToMove = null;
        let isLoading = false;
        let correctCount = 0;
        let totalCount = 0;

        // --- Load initial position ---
        async function loadPosition() {
            if (isLoading) return;
            isLoading = true;

            // Reset UI
            document.getElementById('result-panel').classList.remove('visible');
            document.getElementById('guess-panel').style.display = 'block';
            document.getElementById('board-container').innerHTML = `
                        <div class="loading-indicator">
                            <div class="spinner"></div>
                            <span>Stockfish 分析中...</span>
                        </div>`;
            document.getElementById('fen-display').textContent = '';
            document.getElementById('side-indicator').textContent = '';
            document.getElementById('next-btn').disabled = false;

            // Enable all guess buttons
            document.querySelectorAll('.eval-btn').forEach(btn => {
                btn.disabled = false;
            });

            try {
                const response = await fetch('/api/position');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                currentSessionId = data.session_id;
                currentSideToMove = data.side_to_move;

                // Display board
                document.getElementById('board-container').innerHTML = data.svg;

                // Display FEN
                document.getElementById('fen-display').textContent = 'FEN: ' + data.fen;

                // Display side to move
                const sideEl = document.getElementById('side-indicator');
                if (data.side_to_move === 'white') {
                    sideEl.textContent = '⬜ 白方走棋 (White to move)';
                    sideEl.className = 'side-indicator white';
                } else {
                    sideEl.textContent = '⬛ 黑方走棋 (Black to move)';
                    sideEl.className = 'side-indicator black';
                }
            } catch (err) {
                console.error('Failed to load position:', err);
                document.getElementById('board-container').innerHTML = `
                            <div style="color: var(--accent); text-align: center; padding: 40px;">
                                ⚠️ 加载失败<br>
                                <small>${err.message}</small><br>
                                <button onclick="loadPosition()" style="margin-top:12px;padding:8px 20px;border-radius:6px;cursor:pointer;">重试</button>
                            </div>`;
            } finally {
                isLoading = false;
            }
        }

        // --- Handle guess ---
        async function submitGuess(category) {
            if (!currentSessionId || isLoading) return;
            isLoading = true;

            // Disable all guess buttons
            document.querySelectorAll('.eval-btn').forEach(btn => {
                btn.disabled = true;
            });

            try {
                const response = await fetch('/api/guess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        category: category
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || `HTTP ${response.status}`);
                }

                const result = await response.json();
                displayResult(result, category);
                updateStats(result.correct);

                currentSessionId = null;
            } catch (err) {
                console.error('Failed to submit guess:', err);
                alert('提交失败: ' + err.message);
                // Re-enable buttons on error
                document.querySelectorAll('.eval-btn').forEach(btn => {
                    btn.disabled = false;
                });
            } finally {
                isLoading = false;
            }
        }

        // --- Display result ---
        function displayResult(result, guessCategory) {
            const panel = document.getElementById('result-panel');
            const content = document.getElementById('result-content');

            const isCorrect = result.correct;
            const icon = isCorrect ? '✅' : '❌';
            const summaryClass = isCorrect ? 'correct' : 'incorrect';
            const summaryText = isCorrect ?
                '正确！你的判断与 Stockfish 18 一致' :
                '错误 — 来看看正确答案';

            // Category display names
            const catNames = {
                'white_winning': '白胜势',
                'white_big': '白大优',
                'white_slight': '白小优',
                'equal': '均势',
                'black_slight': '黑小优',
                'black_big': '黑大优',
                'black_winning': '黑胜势'
            };

            let pvHTML = '';
            if (result.pv && result.pv.length > 0) {
                pvHTML = `
                        <div class="detail-row">
                            <span class="detail-label">主要变例 (PV)</span>
                        </div>
                        <div class="pv-line">${result.pv.join(' ')}</div>`;
            }

            content.innerHTML = `
                    <div class="result-summary ${summaryClass}">
                        <span class="icon">${icon}</span>
                        <span>${summaryText}</span>
                    </div>
                    <div class="result-details">
                        <div class="detail-row">
                            <span class="detail-label">你的判断</span>
                            <span class="detail-value">${catNames[result.guess_category] || result.guess_category}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">正确答案</span>
                            <span class="detail-value ${isCorrect ? 'green' : 'red'}">${result.correct_label}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Stockfish 18 评价值</span>
                            <span class="detail-value">${result.eval_text}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">最佳着法</span>
                            <span class="detail-value green">${result.bestmove || 'N/A'}</span>
                        </div>
                        ${pvHTML}
                    </div>`;

            panel.classList.add('visible');
            document.getElementById('guess-panel').style.display = 'none';
        }

        // --- Update stats ---
        function updateStats(correct) {
            totalCount++;
            if (correct) correctCount++;
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-count').textContent = totalCount;
            const accuracy = totalCount > 0 ? (correctCount / totalCount * 100).toFixed(1) + '%' : '-';
            document.getElementById('accuracy').textContent = accuracy;
        }

        // --- Next position ---
        function nextPosition() {
            document.getElementById('result-panel').classList.remove('visible');
            document.getElementById('guess-panel').style.display = 'block';
            loadPosition();
        }

        // --- Attach event listeners to guess buttons ---
        document.querySelectorAll('.eval-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const category = btn.dataset.category;
                if (category) {
                    submitGuess(category);
                }
            });
        });

        // --- Keyboard shortcuts ---
        document.addEventListener('keydown', (e) => {
            if (isLoading) return;

            const keyMap = {
                '1': 'white_winning',
                '2': 'white_big',
                '3': 'white_slight',
                '4': 'equal',
                '5': 'black_slight',
                '6': 'black_big',
                '7': 'black_winning',
                'n': 'next',  // next position
                ' ': 'next',  // space for next
            };

            const action = keyMap[e.key];
            if (!action) return;

            e.preventDefault();

            if (action === 'next') {
                if (!currentSessionId) {
                    nextPosition();
                }
            } else if (currentSessionId) {
                submitGuess(action);
            }
        });

        // --- Start ---
        loadPosition();
    </script>
</body>
</html>
